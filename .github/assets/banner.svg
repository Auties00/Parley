      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
